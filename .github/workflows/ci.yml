name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate provenance and accepted artifacts
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          (cd gallery && sha256sum --check SHA256SUMS)
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication
          test "$(stat -c %s \
            build/libs/bluemap-rechiseled-create-addon-0.1.0-alpha.1-sources.jar)" \
            -eq 126474
          test "$(stat -c %s build/publications/addon/pom-default.xml)" \
            -eq 1378
          test "$(stat -c %s build/publications/addon/module.json)" \
            -eq 2890
          sha256sum --check <<'SHA256SUMS'
          651b8be8a41d459f04f3ec1cbc64ba7441cceb3c2bb3c07d518556a11c83596b  build/libs/bluemap-rechiseled-create-addon-0.1.0-alpha.1.jar
          c64d5b21eabe488ed6b5c1dc8584fefb172f2a247cb8c29847374a26b8030a9f  build/libs/bluemap-rechiseled-create-addon-0.1.0-alpha.1-sources.jar
          9bf59963958a7a595e0c520d66565280327e14cf0f9e692e7884feee169197e1  build/publications/addon/pom-default.xml
          cda1e40a526407a50312aee37e0fc277f6029ba4dcb29f6cd9094cc5aa1dd1ff  build/publications/addon/module.json
          SHA256SUMS

      - name: Reproduce accepted gallery archive
        run: |
          gallery_root="${RUNNER_TEMP}/gallery-root"
          mkdir -p "${gallery_root}" build/gallery
          cp -a gallery/datapack/. "${gallery_root}/"
          find "${gallery_root}" -exec touch -h -t 198001010000.00 {} +
          (
            cd "${gallery_root}"
            LC_ALL=C find . -type f -printf '%P\n' | LC_ALL=C sort |
              zip -q -X -9 \
                "${GITHUB_WORKSPACE}/build/gallery/bluemap-rechiseledcreate-gallery.zip" \
                -@
          )
          test "$(stat -c %s \
            build/gallery/bluemap-rechiseledcreate-gallery.zip)" -eq 13516
          sha256sum --check <<'SHA256SUMS'
          f5084c9b24d9645565b9e6708ee3ac10ea004ecacf7e2a45d6e85b3e5490ac4c  build/gallery/bluemap-rechiseledcreate-gallery.zip
          SHA256SUMS

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-rechiseled-create-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/gallery/*.zip
            build/reports/**
          if-no-files-found: error
          retention-days: 14
