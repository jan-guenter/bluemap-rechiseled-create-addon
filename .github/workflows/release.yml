name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v* tag to release or resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'

      - name: Acquire exact ephemeral runtime inputs
        run: |
          input_dir="${RUNNER_TEMP}/rechiseled-create-inputs"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/rechiseledcreate-1.1.1-neoforge-mc1.21.jar" \
            "https://cdn.modrinth.com/data/E6867niZ/versions/VnOezhJR/rechiseledcreate-1.1.1-neoforge-mc1.21.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/rechiseled-1.2.5-neoforge-mc1.21.jar" \
            "https://cdn.modrinth.com/data/B0g2vT6l/versions/S5FnErRw/rechiseled-1.2.5-neoforge-mc1.21.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            "https://cdn.modrinth.com/data/p19vrgc2/versions/6Oxgpgr9/fusion-1.3.12-neoforge-mc1.21.1.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/create-1.21.1-6.0.10.jar" \
            "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar"
          (
            cd "${input_dir}"
            test "$(stat -c %s rechiseledcreate-1.1.1-neoforge-mc1.21.jar)" \
              -eq 983177
            test "$(stat -c %s rechiseled-1.2.5-neoforge-mc1.21.jar)" \
              -eq 11498611
            test "$(stat -c %s fusion-1.3.12-neoforge-mc1.21.1.jar)" \
              -eq 923270
            test "$(stat -c %s create-1.21.1-6.0.10.jar)" \
              -eq 19123767
            sha256sum --check <<'SHA256SUMS'
          ba89cd5d1221621ed226cc7f1c26dc84a660cc4f6d122753052429f96d71248d  rechiseledcreate-1.1.1-neoforge-mc1.21.jar
          7bf14cf8a4bfdc4b6c990126a75da29fd2bb7559d1c05b71e29c8fd5ae044435  rechiseled-1.2.5-neoforge-mc1.21.jar
          17f5215648a98bcde4134577b013200dbf363273ae282449c51408ae8346f2fa  fusion-1.3.12-neoforge-mc1.21.1.jar
          ef87fe5709f1ba1f5b8bb20a2925b5afb4669e178fd6d8bf10c167759eefe37a  create-1.21.1-6.0.10.jar
          SHA256SUMS
          )

      - name: Build and verify accepted bytes
        run: |
          input_dir="${RUNNER_TEMP}/rechiseled-create-inputs"
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 gallery/generate.py \
            --artifact-dir "${input_dir}" --check
          python3 gallery/lint.py --artifact-dir "${input_dir}"
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          (cd gallery && sha256sum --check SHA256SUMS)
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PbridgeJar="${input_dir}/rechiseledcreate-1.1.1-neoforge-mc1.21.jar" \
            -PrechiseledJar="${input_dir}/rechiseled-1.2.5-neoforge-mc1.21.jar" \
            -PfusionJar="${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            -PcreateJar="${input_dir}/create-1.21.1-6.0.10.jar" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyPinnedArtifacts
          test "$(stat -c %s \
            "build/libs/bluemap-rechiseled-create-addon-${VERSION}-sources.jar")" \
            -eq 126474
          test "$(stat -c %s build/publications/addon/pom-default.xml)" \
            -eq 1378
          test "$(stat -c %s build/publications/addon/module.json)" \
            -eq 2890
          sha256sum --check <<SHA256SUMS
          651b8be8a41d459f04f3ec1cbc64ba7441cceb3c2bb3c07d518556a11c83596b  build/libs/bluemap-rechiseled-create-addon-${VERSION}.jar
          c64d5b21eabe488ed6b5c1dc8584fefb172f2a247cb8c29847374a26b8030a9f  build/libs/bluemap-rechiseled-create-addon-${VERSION}-sources.jar
          9bf59963958a7a595e0c520d66565280327e14cf0f9e692e7884feee169197e1  build/publications/addon/pom-default.xml
          cda1e40a526407a50312aee37e0fc277f6029ba4dcb29f6cd9094cc5aa1dd1ff  build/publications/addon/module.json
          SHA256SUMS

      - name: Reproduce accepted gallery archive
        run: |
          gallery_root="${RUNNER_TEMP}/gallery-root"
          mkdir -p "${gallery_root}" build/gallery
          cp -a gallery/datapack/. "${gallery_root}/"
          find "${gallery_root}" -exec touch -h -t 198001010000.00 {} +
          (
            cd "${gallery_root}"
            LC_ALL=C find . -type f -printf '%P\n' | LC_ALL=C sort |
              zip -q -X -9 \
                "${GITHUB_WORKSPACE}/build/gallery/bluemap-rechiseledcreate-gallery.zip" \
                -@
          )
          test "$(stat -c %s \
            build/gallery/bluemap-rechiseledcreate-gallery.zip)" -eq 13516
          sha256sum --check <<'SHA256SUMS'
          f5084c9b24d9645565b9e6708ee3ac10ea004ecacf7e2a45d6e85b3e5490ac4c  build/gallery/bluemap-rechiseledcreate-gallery.zip
          SHA256SUMS

      - name: Prepare release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-rechiseled-create-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-rechiseled-create-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-rechiseled-create-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-rechiseled-create-addon-${VERSION}.module.json"
          (cd release && sha256sum -- ./* > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)
          test "$(stat -c %s release/SHA256SUMS)" -eq 488
          test "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" = \
            a415cfac6dcb5f642f9c77af0f24fd5a3e6a98d1a6c1bfea0b4523c75f6d1697

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Rechiseled: Create Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release JARs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.jar

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          input_dir="${RUNNER_TEMP}/rechiseled-create-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PbridgeJar="${input_dir}/rechiseledcreate-1.1.1-neoforge-mc1.21.jar" \
            -PrechiseledJar="${input_dir}/rechiseled-1.2.5-neoforge-mc1.21.jar" \
            -PfusionJar="${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            -PcreateJar="${input_dir}/create-1.21.1-6.0.10.jar" \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
